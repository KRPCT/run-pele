<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Run Pele — Mermaid 图表渲染与可复用技能</title>
  <desc id="hero-desc">33 类图型，591 个官方来源示例，12 组复杂案例。将 Mermaid 渲染为 SVG 与 HTML，保留可编辑源码。</desc>
  <rect width="1200" height="420" rx="16" fill="#111821"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="52" y="58" font-size="18" letter-spacing="2" fill="#b5c0cc">MERMAID · SVG · HTML</text>
    <text x="48" y="151" font-size="86" font-weight="650" letter-spacing="-3" fill="#f2f3ef">Run Pele<tspan fill="#ed8b6b">.</tspan></text>
    <text x="52" y="210" font-size="32" fill="#f2f3ef">从源码到图表，</text>
    <text x="52" y="255" font-size="32" fill="#f2f3ef">把结构讲清楚。</text>
    <path d="M52 302 H1148" stroke="#344150"/>
    <text x="52" y="366" font-size="42" font-weight="600" fill="#ed8b6b">33<tspan dx="16" font-size="21" font-weight="400" fill="#c1cbd6">类图型</tspan></text>
    <text x="332" y="366" font-size="42" font-weight="600" fill="#f2f3ef">591<tspan dx="16" font-size="21" font-weight="400" fill="#c1cbd6">个示例</tspan></text>
    <text x="670" y="366" font-size="42" font-weight="600" fill="#f2f3ef">12<tspan dx="16" font-size="21" font-weight="400" fill="#c1cbd6">组深入案例</tspan></text>
    <text x="1148" y="366" text-anchor="end" font-size="19" fill="#aab7c5">Pele 1.10.0</text>
    <text x="646" y="61" font-size="20" fill="#aab7c5" font-family="Consolas, monospace">render(source).svg</text>
  </g>
  <style>.hero-diagram .pele{--pele-bg:#111821;--pele-fg:#f2f3ef;--pele-line:#b7c6d5;--pele-surface:#202e3c;--pele-border:#62788b;--pele-accent:#ed8b6b;--pele-radius:8px}</style>
  <g class="hero-diagram" transform="translate(626 100) scale(1)"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 444 182" width="444" height="182" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:26px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Segoe UI, Microsoft YaHei, PingFang SC, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_source_engine_0"><path d="M145.11,91L186.11,91"/><path class="pele-marker" d="M193.11,91L185.11,94.36L185.11,87.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_engine_svg_0"><path d="M281.14,83C298.64,83 298.64,39.5 316.14,39.5L322.14,39.5"/><path class="pele-marker" d="M329.14,39.5L321.14,42.86L321.14,36.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_engine_html_0"><path d="M281.14,99C298.64,99 298.64,142.5 316.14,142.5L322.14,142.5"/><path class="pele-marker" d="M329.14,142.5L321.14,145.86L321.14,139.14Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="source" transform="translate(76.56,91)"><rect x="-68.56" y="-31.5" width="137.11" height="63" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="9.1" text-anchor="middle">Mermaid</text></g><g class="pele-node pele-shape-rect" data-id="engine" transform="translate(237.13,91)"><rect x="-44.01" y="-31.5" width="88.03" height="63" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="9.1" text-anchor="middle">Pele</text></g><g class="pele-node pele-shape-rect" data-id="svg" transform="translate(374.6,39.5)"><rect x="-45.46" y="-31.5" width="90.91" height="63" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="9.1" text-anchor="middle">SVG</text></g><g class="pele-node pele-shape-rect" data-id="html" transform="translate(382.53,142.5)"><rect x="-53.39" y="-31.5" width="106.77" height="63" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="9.1" text-anchor="middle">HTML</text></g></g></svg></g>
</svg>
