<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-swimlane" viewBox="0 0 584 304" width="584" height="304" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Segoe UI, Microsoft YaHei, PingFang SC, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="swimlane" aria-labelledby="readme-order-handoff-title" aria-describedby="readme-order-handoff-desc"><style>.pele {
